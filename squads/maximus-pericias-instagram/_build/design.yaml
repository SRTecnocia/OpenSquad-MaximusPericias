# Design output - generated by Design phase
# Input: discovery.yaml + research + investigation + approved template system (A+B+C)

squad:
  code: "maximus-pericias-instagram"
  name: "Esquadrão Maximus Perícias Instagram (Feed, Reels & Stories)"
  description: "Analisa a plataforma pericias.btech.inf.br e os vídeos oficiais para criar, renderizar e publicar conteúdos de Feed, Reels e Stories no Instagram @maximus.pericias com fidelidade absoluta ao Design System e posicionamento de elite."

template_selection:
  status: "approved"
  mode: "unified-a-b-c"
  template_reference: "pipeline/data/template-reference.html"
  visual_identity: "pipeline/data/visual-identity.md"
  previews:
    - "_build/template-a.png"
    - "_build/template-b.png"
    - "_build/template-c.png"

agents:
  - id: "mario-minerador"
    name: "Mário Minerador"
    title: "Analista Forense de Produto e Mídia Sintética"
    icon: "🔍"
    execution: "inline"
    role_summary: "Extrai mecanismos reais, métricas auditadas e quadros exatos da Landing Page e dos 2 vídeos oficiais."
    skills:
      - "image-fetcher"
    tasks:
      - name: "extract-product-intelligence"
        file: "tasks/extract-product-intelligence.md"
        description: "Cataloga funcionalidades, provas visuais e minutagens exatas dos vídeos para a pauta da campanha."
  - id: "breno-branding"
    name: "Breno Branding"
    title: "Estrategista de Posicionamento e Narrativa em 3 Atos"
    icon: "🧠"
    execution: "inline"
    role_summary: "Aplica o filtro Steve Jobs, diagnóstico de Eugene Schwartz e gera 5 ângulos persuasivos em 3 atos."
    skills: []
    tasks:
      - name: "generate-angles"
        file: "tasks/generate-angles.md"
        description: "Gera 5 ângulos de posicionamento distintos sobre o mecanismo selecionado."
  - id: "flavio-feed"
    name: "Flávio Feed"
    title: "Criador de Carrosséis e Posts de Feed Instagram"
    icon: "📱"
    execution: "inline"
    role_summary: "Cria carrosséis de 8 a 10 lâminas (40-80 palavras por slide), 3 ganchos e legenda otimizada."
    skills: []
    tasks:
      - name: "create-instagram-feed"
        file: "tasks/create-instagram-feed.md"
        description: "Redige a copy estruturada do Carrossel de Feed com 3 opções de gancho e legenda."
  - id: "renato-reels"
    name: "Renato Reels"
    title: "Roteirista e Diretor de Instagram Reels"
    icon: "🎬"
    execution: "inline"
    role_summary: "Roteiriza vídeos verticais 9:16 (15-30s) com minutagem exata dos vídeos oficiais, legendas e loop."
    skills: []
    tasks:
      - name: "create-instagram-reels"
        file: "tasks/create-instagram-reels.md"
        description: "Cria o roteiro técnico de Reels mapeando cortes dos vídeos locais e texto em tela."
  - id: "soraia-stories"
    name: "Soraia Stories"
    title: "Estrategista de Sequências de Stories"
    icon: "⚡"
    execution: "inline"
    role_summary: "Cria sequências de 4 a 6 Stories verticais com elemento interativo binário e conversão direta."
    skills: []
    tasks:
      - name: "create-instagram-stories"
        file: "tasks/create-instagram-stories.md"
        description: "Desenvolve a sequência diária de Stories com enquete/quiz e chamada para ação."
  - id: "davi-designer"
    name: "Davi Designer"
    title: "Arquiteto Visual e Renderizador HTML/CSS"
    icon: "🎨"
    execution: "inline"
    role_summary: "Converte copy aprovada em HTML/CSS autocontido (Sistema A+B+C) e renderiza PNG/JPEG via Playwright."
    skills:
      - "template-designer"
      - "image-creator"
      - "image-fetcher"
      - "image-ai-generator"
    tasks:
      - name: "render-visual-assets"
        file: "tasks/render-visual-assets.md"
        description: "Gera os arquivos HTML/CSS e renderiza os slides de Feed (1080x1440) e Stories/Reels (1080x1920)."
  - id: "vera-veredito"
    name: "Vera Veredito"
    title: "Auditora de Qualidade, Branding e Fidelidade Técnica"
    icon: "🛡️"
    execution: "inline"
    role_summary: "Audita precisão factual, Design System, contraste WCAG AA, tamanhos de fonte e regras de copy."
    skills: []
    tasks:
      - name: "review-campaign"
        file: "tasks/review-campaign.md"
        description: "Avalia todos os entregáveis de texto e imagem e emite veredito APPROVE ou REJECT."
  - id: "paulo-publicador"
    name: "Paulo Publicador"
    title: "Especialista de Publicação no Instagram"
    icon: "🚀"
    execution: "inline"
    role_summary: "Apresenta Publish Preview, executa dry-run obrigatório e publica no @maximus.pericias via .env."
    skills:
      - "instagram-publisher"
    tasks:
      - name: "publish-instagram"
        file: "tasks/publish-instagram.md"
        description: "Valida ativos, roda dry-run e publica no Instagram oficial após confirmação explícita."

pipeline:
  - step: 1
    name: "research-focus"
    type: "checkpoint"
    output_file: "squads/maximus-pericias-instagram/output/research-focus.md"
  - step: 2
    name: "extract-intelligence"
    type: "agent"
    agent: "mario-minerador"
    execution: "inline"
    input_file: "squads/maximus-pericias-instagram/output/research-focus.md"
    output_file: "squads/maximus-pericias-instagram/output/product-intelligence.md"
  - step: 3
    name: "generate-angles"
    type: "agent"
    agent: "breno-branding"
    execution: "inline"
    input_file: "squads/maximus-pericias-instagram/output/product-intelligence.md"
    output_file: "squads/maximus-pericias-instagram/output/campaign-angles.md"
  - step: 4
    name: "select-angle-and-tone"
    type: "checkpoint"
    output_file: "squads/maximus-pericias-instagram/output/selected-angle.md"
  - step: 5
    name: "create-feed"
    type: "agent"
    agent: "flavio-feed"
    execution: "inline"
    format: "instagram-feed"
    input_file: "squads/maximus-pericias-instagram/output/selected-angle.md"
    output_file: "squads/maximus-pericias-instagram/output/feed-post.md"
  - step: 6
    name: "create-reels"
    type: "agent"
    agent: "renato-reels"
    execution: "inline"
    format: "instagram-reels"
    input_file: "squads/maximus-pericias-instagram/output/feed-post.md"
    output_file: "squads/maximus-pericias-instagram/output/reels-script.md"
  - step: 7
    name: "create-stories"
    type: "agent"
    agent: "soraia-stories"
    execution: "inline"
    format: "instagram-stories"
    input_file: "squads/maximus-pericias-instagram/output/reels-script.md"
    output_file: "squads/maximus-pericias-instagram/output/stories-sequence.md"
  - step: 8
    name: "approve-content"
    type: "checkpoint"
  - step: 9
    name: "render-visuals"
    type: "agent"
    agent: "davi-designer"
    execution: "inline"
    input_file: "squads/maximus-pericias-instagram/output/stories-sequence.md"
    output_file: "squads/maximus-pericias-instagram/output/visual-assets-manifest.md"
  - step: 10
    name: "review-campaign"
    type: "agent"
    agent: "vera-veredito"
    execution: "inline"
    input_file: "squads/maximus-pericias-instagram/output/visual-assets-manifest.md"
    output_file: "squads/maximus-pericias-instagram/output/review-report.md"
    on_reject: "5"
  - step: 11
    name: "approve-final-assets"
    type: "checkpoint"
  - step: 12
    name: "publish-instagram"
    type: "agent"
    agent: "paulo-publicador"
    execution: "inline"
    input_file: "squads/maximus-pericias-instagram/output/review-report.md"
    output_file: "squads/maximus-pericias-instagram/output/publish-report.md"

investigation:
  enriched: true
