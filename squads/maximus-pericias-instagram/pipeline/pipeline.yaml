name: "Pipeline Maximus Perícias Instagram (Feed, Reels & Stories)"
max_review_cycles: 3

checkpoints:
  - "step-01-research-focus"
  - "step-04-select-angle-and-tone"
  - "step-08-approve-content"
  - "step-11-approve-final-assets"

steps:
  - id: "step-01-research-focus"
    file: "steps/step-01-research-focus.md"
    type: "checkpoint"
    outputFile: "squads/maximus-pericias-instagram/output/research-focus.md"
  - id: "step-02-extract-intelligence"
    file: "steps/step-02-extract-intelligence.md"
    type: "agent"
    agent: "mario-minerador"
    execution: "inline"
    inputFile: "squads/maximus-pericias-instagram/output/research-focus.md"
    outputFile: "squads/maximus-pericias-instagram/output/product-intelligence.md"
  - id: "step-03-generate-angles"
    file: "steps/step-03-generate-angles.md"
    type: "agent"
    agent: "breno-branding"
    execution: "inline"
    inputFile: "squads/maximus-pericias-instagram/output/product-intelligence.md"
    outputFile: "squads/maximus-pericias-instagram/output/campaign-angles.md"
  - id: "step-04-select-angle-and-tone"
    file: "steps/step-04-select-angle-and-tone.md"
    type: "checkpoint"
    outputFile: "squads/maximus-pericias-instagram/output/selected-angle.md"
  - id: "step-05-create-feed"
    file: "steps/step-05-create-feed.md"
    type: "agent"
    agent: "flavio-feed"
    execution: "inline"
    format: "instagram-feed"
    inputFile: "squads/maximus-pericias-instagram/output/selected-angle.md"
    outputFile: "squads/maximus-pericias-instagram/output/feed-post.md"
  - id: "step-06-create-reels"
    file: "steps/step-06-create-reels.md"
    type: "agent"
    agent: "renato-reels"
    execution: "inline"
    format: "instagram-reels"
    inputFile: "squads/maximus-pericias-instagram/output/feed-post.md"
    outputFile: "squads/maximus-pericias-instagram/output/reels-script.md"
  - id: "step-07-create-stories"
    file: "steps/step-07-create-stories.md"
    type: "agent"
    agent: "soraia-stories"
    execution: "inline"
    format: "instagram-stories"
    inputFile: "squads/maximus-pericias-instagram/output/reels-script.md"
    outputFile: "squads/maximus-pericias-instagram/output/stories-sequence.md"
  - id: "step-08-approve-content"
    file: "steps/step-08-approve-content.md"
    type: "checkpoint"
  - id: "step-09-render-visuals"
    file: "steps/step-09-render-visuals.md"
    type: "agent"
    agent: "davi-designer"
    execution: "inline"
    inputFile: "squads/maximus-pericias-instagram/output/stories-sequence.md"
    outputFile: "squads/maximus-pericias-instagram/output/visual-assets-manifest.md"
  - id: "step-10-review-campaign"
    file: "steps/step-10-review-campaign.md"
    type: "agent"
    agent: "vera-veredito"
    execution: "inline"
    inputFile: "squads/maximus-pericias-instagram/output/visual-assets-manifest.md"
    outputFile: "squads/maximus-pericias-instagram/output/review-report.md"
    on_reject: "step-05-create-feed"
  - id: "step-11-approve-final-assets"
    file: "steps/step-11-approve-final-assets.md"
    type: "checkpoint"
  - id: "step-12-publish-instagram"
    file: "steps/step-12-publish-instagram.md"
    type: "agent"
    agent: "paulo-publicador"
    execution: "inline"
    inputFile: "squads/maximus-pericias-instagram/output/review-report.md"
    outputFile: "squads/maximus-pericias-instagram/output/publish-report.md"

